# 電影行程：觀眾即時評分。部署：在這個資料夾執行 npx wrangler deploy（需要 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID）
name = "movie-ratings"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "MOVIE"
class_name = "Movie"

[[durable_objects.bindings]]
name = "LIMIT"
class_name = "Limit"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Movie", "Limit"]
