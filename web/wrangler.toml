# 片刻網頁版。部署：在這個資料夾執行 npx wrangler deploy（先在 repo 根目錄跑 ./build.sh 產生 public/app.js）
name = "app"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 靜態檔（首頁、程式本體、圖示、關於頁…）放在 site/（build.sh 產生），由 Cloudflare 直接送出：
# 不經過 Worker、不算每天的請求額度。只有 /api/* 這些要運算的才會進 Worker。
# 部署由 GitHub Actions 做（.github/workflows/deploy-web.yml）：靜態資源的上傳在開發用的雲端環境裡會被擋（401），不要在那裡手動 deploy
[assets]
directory = "./site"

# 同樣的檔案也打包進 Worker 當備援（見 worker.js）：靜態資源那邊找不到時才會用到
[[rules]]
type = "Text"
globs = ["**/*.js.txt", "**/*.html.txt", "**/*.html", "**/*.webmanifest"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# 收藏電影的通知：訂閱資料存在一個 Durable Object 裡；每小時檢查一次有沒有要通知的事
[[durable_objects.bindings]]
name = "PUSH"
class_name = "PushHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushHub"]

# 管理員專區（短評的人工審核）：直接呼叫評分伺服器的管理入口。這個入口只有綁定的 Worker 連得到，不對外
[[services]]
binding = "RATINGS"
service = "movie-ratings"
entrypoint = "AdminRpc"

# 登入帳號的人評分、寫短評：驗過登入後從這個入口交給評分伺服器（一個帳號一票）。同樣只有綁定的 Worker 連得到
[[services]]
binding = "RATE"
service = "movie-ratings"
entrypoint = "AccountRpc"

# 管理員名單不寫在這裡（這個程式庫是公開的）：
#   站長本人放在這個 Worker 的加密設定 ADMIN_EMAILS（Cloudflare 後台 → Workers → app → 設定 → 變數與機密；只能寫入、讀不出來），
#   其他管理員在 App 的「設定 → 同步 → 管理員名單」新增、移除。

[triggers]
# 41 分：推通知。9、39 分：叫 GitHub 匯出片刻評分的統計檔（見 worker.js 的 scheduled）
crons = ["41 * * * *", "9,39 * * * *"]
