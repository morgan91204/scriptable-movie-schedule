# 電影行程網頁版。部署：在這個資料夾執行 npx wrangler deploy（先在 repo 根目錄跑 ./build.sh 產生 public/app.js）
name = "app"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 所有檔案都打包進 Worker（見 worker.js），不走靜態檔上傳：每次發佈只要上傳這支 Worker
[[rules]]
type = "Text"
globs = ["**/*.js.txt", "**/*.html.txt", "**/*.html", "**/*.webmanifest"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# 收藏電影的通知：訂閱資料存在一個 Durable Object 裡；每小時檢查一次有沒有要通知的事
[[durable_objects.bindings]]
name = "PUSH"
class_name = "PushHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushHub"]

[triggers]
crons = ["41 * * * *"]
