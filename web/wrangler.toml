# 片刻網頁版。部署：在這個資料夾執行 npx wrangler deploy（先在 repo 根目錄跑 ./build.sh 產生 public/app.js）
name = "app"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 靜態檔（首頁、程式本體、圖示、關於頁…）放在 site/（build.sh 產生），由 Cloudflare 直接送出：
# 不經過 Worker、不算每天的請求額度。只有 /api/* 這些要運算的才會進 Worker。
# 部署由 GitHub Actions 做（.github/workflows/deploy-web.yml）：靜態資源的上傳在開發用的雲端環境裡會被擋（401），不要在那裡手動 deploy
[assets]
directory = "./site"

# 同樣的檔案也打包進 Worker 當備援（見 worker.js）：靜態資源那邊找不到時才會用到
[[rules]]
type = "Text"
globs = ["**/*.js.txt", "**/*.html.txt", "**/*.html", "**/*.webmanifest"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# 收藏電影的通知：訂閱資料存在一個 Durable Object 裡；每小時檢查一次有沒有要通知的事
[[durable_objects.bindings]]
name = "PUSH"
class_name = "PushHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushHub"]

[triggers]
crons = ["41 * * * *"]
