    <script>
        var ProgramPath = "Festival.aspx";
        var manualStateChange = false;

        window.onpopstate = function (event) {
            //alert("location: " + document.location + ", state: " + JSON.stringify(event.state));
            //alert('state:' + JSON.stringify(event.state));
            if (JSON.stringify(event.state) == "undefined") return;
            manualStateChange = true;
            var strUrl = location.search;
            var getPara, ParaVal;
            var aryPara = [];
            var pgid;
            var id;
            var nid;

            if (strUrl.indexOf("?") != -1) {
                var getSearch = strUrl.split("?");
                getPara = getSearch[1].split("&");
                for (i = 0; i < getPara.length; i++) {
                    ParaVal = getPara[i].split("=");
                    if (ParaVal[0] == "ID") id = ParaVal[1];
                    if (ParaVal[0] == "pg") pgid = ParaVal[1];
                    if (ParaVal[0] == "d") nid = ParaVal[1];
                }
                if (id == $('#ContentPlaceHolder1_hfID').val() && pgid == $('#ContentPlaceHolder1_hfPage').val() && nid.length == 0) {
                    BackToMainList();
                    manualStateChange = false;//確保每次loading的結束動作
                } else {
                    if (id.length > 0) LoadSubTitle(id);
                    if (nid.length > 0) LoadDataText(nid);
                    RefreshURL(false);//ReplaceURL
                }
            } else {
                history.go(-1);
            }
        };
        $(function () {
            LoadInitPage();
            LoadPageAttr_HTML();
            RefreshURL(false);
            
            //LoadToyBrick_HTML();
        });
        function RefreshURL(flag) {
            if (location.search == "?ID=" + $('#ContentPlaceHolder1_hfID').val() + "&ek=" + $('#ContentPlaceHolder1_hfEnumAgnKey').val() + "&pg=" + $('#ContentPlaceHolder1_hfPage').val() + "&d=" + $('#ContentPlaceHolder1_hfNID').val()) {
                return;
            } else {
                if (flag == true) {
                    var state = { href: $(this).attr('href') };
                    history.pushState(state, document.title, ProgramPath + "?ID=" + $('#ContentPlaceHolder1_hfID').val() + "&ek=" + $('#ContentPlaceHolder1_hfEnumAgnKey').val() + "&pg=" + $('#ContentPlaceHolder1_hfPage').val() + "&d=" + $('#ContentPlaceHolder1_hfNID').val());
                } else {
                    var state = { href: $(this).attr('href') };
                    history.replaceState(state, document.title, ProgramPath + "?ID=" + $('#ContentPlaceHolder1_hfID').val() + "&ek=" + $('#ContentPlaceHolder1_hfEnumAgnKey').val() + "&pg=" + $('#ContentPlaceHolder1_hfPage').val() + "&d=" + $('#ContentPlaceHolder1_hfNID').val());
                }
            }
        }
        //特殊處理
        function Submenu_URLLinkRefresh(inputID){
            location.href= ProgramPath+"?ID="+inputID+"&ek="+$('#ContentPlaceHolder1_hfEnumAgnKey').val();
        }
        function LoadInitPage() {
            LoadSubTitle($('#ContentPlaceHolder1_hfID').val());
        }
        function LoadSubTitle(subid) {
            $('#ContentPlaceHolder1_hfID').val(subid);            
            $.ajax({
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                dataType: 'json',
                url: ProgramPath+'/LoadSubTitle',
                data: $.toJSON({
                    guid:$('#ContentPlaceHolder1_hfGUID').val(),
                    strID: $('#ContentPlaceHolder1_hfProgramID').val(),
                    strSubID: subid
                }),
                success: function (data) {
                    if (data.d.result == true) {                        
                        $('#divSubTitle').html(data.d.data[0]);
                        if ($('#ContentPlaceHolder1_hfNID').val()== "")
                        {
                            LoadToyBrick_HTML();
                        }else{
                            LoadDataText($('#ContentPlaceHolder1_hfNID').val());
                        }
                    } else {
                        $('#divSubTitle').html("");
                    }
                }
            });
        }
        function LoadPageAttr_HTML() {
            $.ajax({
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                dataType: 'json',
                url: ProgramPath + '/LoadPageAttr_HTML',
                data: $.toJSON({
                    guid: $('#ContentPlaceHolder1_hfGUID').val(),
                    strID: $('#ContentPlaceHolder1_hfProgramID').val(),
                    strSubID: $('#ContentPlaceHolder1_hfID').val(),
                    strType: $('#ContentPlaceHolder1_hfProgramTitle').val(),
                    strMediaType: $('#ContentPlaceHolder1_hfMediaType').val()
                }),
                success: function (data) {
                    if (data.d.result == true) {
                        $('#divPageAttr').html(data.d.data[0]);
                    } else {
                        $('#divPageAttr').html("");
                    }
                }
            });
        }
        
        function LoadToyBrick_HTML() {
            var args = QueryFilter();
            $.ajax({
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                dataType: 'json',
                url: ProgramPath + '/LoadToyBrick_HTML',
                data: $.toJSON({
                    guid: $('#ContentPlaceHolder1_hfGUID').val(),
                    strID: $('#ContentPlaceHolder1_hfProgramID').val(),
                    strSubID: $('#ContentPlaceHolder1_hfID').val(),
                    strType: $('#ContentPlaceHolder1_hfProgramTitle').val(),
                    strMediaType: $('#ContentPlaceHolder1_hfMediaType').val(),
                    strKeyword: $('#ContentPlaceHolder1_hfKeyword').val(),
                    inputArgs: JSON.stringify(args),
                    strPageID: $('#ContentPlaceHolder1_hfPage').val()
                }),
                success: function (data) {
                    if (data.d.result == true) {
                        $('#divToyBrick').html(data.d.data[0]);
                        if($('#ContentPlaceHolder1_hfNID').val()!="")
                        {
                            LoadDataText($('#ContentPlaceHolder1_hfNID').val());
                        }
                    } else {
                        $('#divToyBrick').html("");
                    }
                }
            });
        }
        function UpdateKeyword(toybrick, inputtype, inputvalue,targetitem)
        {
            $.blockUI({ message: '<div>loading....</div>' });
            if (inputtype == "0") {
                $('#ContentPlaceHolder1_hfKeyword').val($('#ContentPlaceHolder1_hfKeyword').val().replace(inputvalue,''));
            }
            if (inputtype == "1") {
                $('#ContentPlaceHolder1_hfKeyword').val($('#ContentPlaceHolder1_hfKeyword').val() + inputvalue + ";");
            }

            //loading current item......
            ReloadToyBrick_HTML(toybrick);
            //loading target item......
            if (targetitem != "") {
                ReloadToyBrick_HTML(targetitem);
            }
            //1.5秒後，解除BlockUI
            setTimeout(function () {
                $.unblockUI();
            }, 1500);
        }
        function ReloadPage(toybrick,pageid)
        {

        function TriggerToyBrick_HTML(toybrick, currentObj, triggerObj, targetitem)
        {
            var args = [];
            args.push({ "ObjName": currentObj, "ObjType": $("#" + currentObj).attr("name"), "ObjValue": $("#" + currentObj).val(), "Comparison": "" });
            if ($("#" + triggerObj).attr("name")!="") {
                args.push({ "ObjName": triggerObj, "ObjType": $("#" + triggerObj).attr("name"), "ObjValue": "%", "Comparison": "" });
            } else {
                args.push({ "ObjName": triggerObj, "ObjType": $("#" + triggerObj).attr("name"), "ObjValue": $("#" + triggerObj).val(), "Comparison": "" });
            }
            //客製FestivalID
            args.push({ "FieldType": "QParameter", "FieldName": "FestivalID", "FieldValue": $('#ContentPlaceHolder1_hfEnumAgnKey').val(), "Comparison": "=" });

            $.ajax({
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                dataType: 'json',
                url: ProgramPath + '/TriggerToyBrick_HTML',
                data: $.toJSON({
                    guid: $('#ContentPlaceHolder1_hfGUID').val(),
                    strSubID: $('#ContentPlaceHolder1_hfID').val(),
                    strToyBrick: toybrick,
                    inputArgs: JSON.stringify(args)
                }),
                success: function (data) {
                    if (data.d.result == true) {
                        //alert(data.d.message);
                        $("#" + toybrick).html(data.d.data[0]);
                        if (targetitem != "") {
                            ReloadToyBrick_HTML(targetitem);
                        }
                    } else {
                        alert(data.d.message);
                    }
                    return data.d.result;
                }
            });
        }
        function QueryFilter() {

            $('.QButton').each(function () {

                if ($(this).hasClass("active")) {
                    var fieldname = $(this).attr("qfield");//欄位名稱
                    var fieldvalue = $(this).attr("qvalue");//欄位值

                    if (fieldvalue != "%") {
                        args.push({ "FieldType": "QButton", "FieldName": fieldname, "FieldValue": fieldvalue, "Comparison": fieldcomp });
                    }
                }
            });

            console.log("QSelect");
            //alert('QSelect');
            $('.QSelect').each(function () {
                var fieldname = $(this).attr("name");//欄位名稱
                var fieldvalue = $(this).val();//欄位值
                var fieldcomp = $(this).attr("qcomp");//比對
                //alert('fieldname='+$(this).attr("name"));//欄位名稱
                //alert('value=' + $(this).val());//欄位值
                //alert(fieldname + "=" + fieldvalue);
                if (fieldvalue != "%") {
                    args.push({ "FieldType": "QSelect", "FieldName": fieldname, "FieldValue": fieldvalue, "Comparison": "="});
                }
            });
            
            return args;
        }

      <script>
        //以下為cookie外掛程式碼
        jQuery.cookie = function (name, value, options) {
          if (typeof value != 'undefined') { // name and value given, set cookie
            options = options || {};
            if (value === null) {
              value = '';
              options.expires = -1;
            }
            var expires = '';
            if (options.expires && (typeof options.expires == 'number' || options.expires.toUTCString)) {
              var date;
              if (typeof options.expires == 'number') {
                date = new Date();
                date.setTime(date.getTime() + (options.expires * 24 * 60 * 60 * 1000));
              } else {
                date = options.expires;
              }
              expires = '; expires=' + date.toUTCString(); // use expires attribute, max-age is not supported by IE
            }
            var path = options.path ? '; path=' + options.path : '';
            var domain = options.domain ? '; domain=' + options.domain : '';
            var secure = options.secure ? '; secure' : '';
            document.cookie = [name, '=', encodeURIComponent(value), expires, path, domain, secure].join('');
          } else { // only name given, get cookie
            var cookieValue = null;
            if (document.cookie && document.cookie != '') {
              var cookies = document.cookie.split(';');
              for (var i = 0; i < cookies.length; i++) {
                var cookie = jQuery.trim(cookies[i]);
                // Does this cookie string begin with the name we want?
                if (cookie.substring(0, name.length + 1) == (name + '=')) {
                  cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                  break;
                }
              }
            }
            return cookieValue;
          }
        };
      </script>
