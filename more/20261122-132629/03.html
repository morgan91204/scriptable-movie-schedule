    <script>
        var ProgramPath = "Default.aspx";
        var manualStateChange = false;

        window.onpopstate = function (event) {
            //alert("location: " + document.location + ", state: " + JSON.stringify(event.state));
            //alert('state:' + JSON.stringify(event.state));
            if (JSON.stringify(event.state) == "undefined") return;
            manualStateChange = true;
            var strUrl = location.search;
            var getPara, ParaVal;
            var aryPara = [];
            var pgid;
            var id;
            var nid;

            if (strUrl.indexOf("?") != -1) {
                var getSearch = strUrl.split("?");
                getPara = getSearch[1].split("&");
                for (i = 0; i < getPara.length; i++) {
                    ParaVal = getPara[i].split("=");
                    if (ParaVal[0] == "ID") id = ParaVal[1];
                    if (ParaVal[0] == "pg") pgid = ParaVal[1];
                    if (ParaVal[0] == "d") nid = ParaVal[1];
                }
                if (id == $('#ContentPlaceHolder1_hfID').val() && pgid == $('#ContentPlaceHolder1_hfPage').val() && nid.length == 0) {
                    BackToMainList();
                    manualStateChange = false;//確保每次loading的結束動作
                } else {
                    if (id.length > 0) LoadSubTitle(id);
                    //if (pgid.length > 0) LoadGridview(pgid); //update field,not refresh url
                    LoadDataText(nid);//update field, not refresh url 
                    RefreshURL(false);//ReplaceURL
                }
            } else {
                history.go(-1);
            }

            
        };
        function isEmail(strEmail) {
            //Regular expression Testing
            emailRule = /^\w+((-\w+)|(\.\w+))*\@[A-Za-z0-9]+((\.|-)[A-Za-z0-9]+)*\.[A-Za-z]+$/;
            if (strEmail.search(emailRule) != -1)
                return true;
            else
                return false;
        }
        $(function () {
            LoadInitPage();
            LoadPageAttr_HTML();
            
            CheckCartItemCount();
        });
        function RefreshURL(flag) {
            if (location.search == "?ID=" + $('#ContentPlaceHolder1_hfID').val() + "&pg=" + $('#ContentPlaceHolder1_hfPage').val() + "&key=" + $('#ContentPlaceHolder1_hfKeyword').val() + "&d=" + $('#ContentPlaceHolder1_hfNID').val()) {
                return;
            } else {
                if (flag == true) {
                    var state = { href: $(this).attr('href') };
                    history.pushState(state, document.title, ProgramPath + "?ID=" + $('#ContentPlaceHolder1_hfID').val() + "&pg=" + $('#ContentPlaceHolder1_hfPage').val() + "&key=" + $('#ContentPlaceHolder1_hfKeyword').val() + "&d=" + $('#ContentPlaceHolder1_hfNID').val());
                } else {
                    var state = { href: $(this).attr('href') };
                    history.replaceState(state, document.title, ProgramPath + "?ID=" + $('#ContentPlaceHolder1_hfID').val() + "&pg=" + $('#ContentPlaceHolder1_hfPage').val() + "&key=" + $('#ContentPlaceHolder1_hfKeyword').val() + "&d=" + $('#ContentPlaceHolder1_hfNID').val());
                }
            }
        }
        function LoadInitPage() {
            LoadSubTitle($('#ContentPlaceHolder1_hfID').val());
        }
        function LoadSubTitle(subid) {
            $('#ContentPlaceHolder1_hfID').val(subid);            
            $.ajax({
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                dataType: 'json',
                url: ProgramPath+'/LoadSubTitle',
                data: $.toJSON({
                    guid:$('#ContentPlaceHolder1_hfGUID').val(),
                    strID: $('#ContentPlaceHolder1_hfProgramID').val(),
                    strSubID: subid
                }),
                success: function (data) {
                    if (data.d.result == true) {                        
                        //$('#divSubTitle').html(data.d.data[0]);
                        LoadToyBrick_HTML();
                        
                    } else {
                        $('#divSubTitle').html("");
                    }
                }
            });
        }
        function LoadPageAttr_HTML() {
            $.ajax({
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                dataType: 'json',
                url: ProgramPath + '/LoadPageAttr_HTML',
                data: $.toJSON({
                    guid: $('#ContentPlaceHolder1_hfGUID').val(),
                    strID: $('#ContentPlaceHolder1_hfProgramID').val(),
                    strSubID: $('#ContentPlaceHolder1_hfID').val(),
                    strType: $('#ContentPlaceHolder1_hfProgramTitle').val(),
                    strMediaType: $('#ContentPlaceHolder1_hfMediaType').val()
                }),
                success: function (data) {
                    if (data.d.result == true) {
                        $('#divPageAttr').html(data.d.data[0]);
                    } else {
                        $('#divPageAttr').html("");
                    }
                }
            });
        }
        
        function LoadToyBrick_HTML() {
            $.ajax({
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                dataType: 'json',
                url: ProgramPath + '/LoadToyBrick_HTML',
                data: $.toJSON({
                    guid: $('#ContentPlaceHolder1_hfGUID').val(),
                    strID: $('#ContentPlaceHolder1_hfProgramID').val(),
                    strSubID: $('#ContentPlaceHolder1_hfID').val(),
                    strType: $('#ContentPlaceHolder1_hfProgramTitle').val(),
                    strMediaType: $('#ContentPlaceHolder1_hfMediaType').val(),
                    strKeyword: $('#ContentPlaceHolder1_hfKeyword').val()
                }),
                success: function (data) {
                    if (data.d.result == true) {
                        $('#divToyBrick').html(data.d.data[0]);
                    } else {
                        $('#divToyBrick').html("");
                    }
                }
            });
        }
        function LoadDataText(nid) {
            $('#ContentPlaceHolder1_hfNID').val(nid);
            if (nid.length > 0) {
                $.ajax({
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                dataType: 'json',
                url: ProgramPath + '/LoadDataText',
                data: $.toJSON({

        //加入購物車
        function AddToCart_Action(inputID,inputQty)
        {
            var value;
            if (inputQty == "")
            {
                var $input = $('#sys_qty_' + inputID);
                value = parseInt($input.val());
            } else {
                value = parseInt(inputQty);
            }
            //alert('AddToCart value=' + value);
            var totalNum = AddToShoppingCar(inputID, value);

            CheckCartItemCount();
            ShowAlertMsg_AddCart();

        function CheckCartItemCount()
        {
            var strMsg = "";
            var cookieProductID = "basket";//指定「名稱」
            var jsonObj = eval('(' + $.cookie(cookieProductID) + ')'); //如果有，把json字串轉換成物件
            var findProduct = false;//是否找到產品ID,找到則為TRUE,否則為FALSH
            //var args_cart = [];
            var iCount = 0;
            for (var obj in jsonObj) {
                //strMsg += "ProductID=" + jsonObj[obj].ProductID + ",Qty=" + jsonObj[obj].Num + "\n";
                //args_cart.push({ "ProductID": jsonObj[obj].ProductID, "Qty": jsonObj[obj].Num });
                findProduct = true;
                //console.log("jsonObj[obj].Num=" + jsonObj[obj].Num);
                if (jsonObj[obj].Num != undefined)
                {
                   iCount += Number(jsonObj[obj].Num);
                }
            }
            //alert("divItemCount=" + iCount.toString());
            $("#divItemCount").html(iCount);

            if (iCount > 0) {
                $("#setting_bar").show();
            } else {
                $("#setting_bar").hide();
            }        
        }
        /*
        新增商品及數量到購物車cookie中,返回當前商品在cookie中的總數
        */
        function AddToShoppingCar(id, num) {
            var _num = 1;
            if (num != undefined)
                _num = num;
            var totalNum = _num; //總數預設為傳入引數
            var cookieSet = { expires: 7, path: '/' }; //設定cookie路徑的
            var cookieProductID = "basket";//指定「名稱」

            //  $.cookie(cookieProductID, null, cookieSet);//清除Cookie
            var jsonStr = "[{'ProductID':'" + id + "','Num':'" + _num + "'}]"; //構造json字串,id是商品id  num是這個商品的數量
            if ($.cookie(cookieProductID) == null) {
                $.cookie(cookieProductID, jsonStr, cookieSet); //如果沒有這個cookie就設定他
            }
            else {
                var jsonObj = eval('(' + $.cookie(cookieProductID) + ')'); //如果有，把json字串轉換成物件
                var findProduct = false;//是否找到產品ID,找到則為TRUE,否則為FALSH
                for (var obj in jsonObj) {
                    if (jsonObj[obj].ProductID == id) {
                        jsonObj[obj].Num = Number(jsonObj[obj].Num) + Number(_num);
                        totalNum = jsonObj[obj].Num;
                        findProduct = true;
                        break;
                    }
                }
                if (findProduct == false) { //沒找到,則新增
                    jsonObj[jsonObj.length] = new Object();
                    jsonObj[jsonObj.length - 1].ProductID = id;
                    jsonObj[jsonObj.length - 1].Num = Number(num);
                }
                $.cookie(cookieProductID, JSON.stringify(jsonObj), cookieSet); //寫入coockie  JSON需要json2.js支援
            }

            //alert($.cookie(cookieProductID));
            return totalNum;
        }

      <script>
        //以下為cookie外掛程式碼
        jQuery.cookie = function (name, value, options) {
          if (typeof value != 'undefined') { // name and value given, set cookie
            options = options || {};
            if (value === null) {
              value = '';
              options.expires = -1;
            }
            var expires = '';
            if (options.expires && (typeof options.expires == 'number' || options.expires.toUTCString)) {
              var date;
              if (typeof options.expires == 'number') {
                date = new Date();
                date.setTime(date.getTime() + (options.expires * 24 * 60 * 60 * 1000));
              } else {
                date = options.expires;
              }
              expires = '; expires=' + date.toUTCString(); // use expires attribute, max-age is not supported by IE
            }
            var path = options.path ? '; path=' + options.path : '';
            var domain = options.domain ? '; domain=' + options.domain : '';
            var secure = options.secure ? '; secure' : '';
            document.cookie = [name, '=', encodeURIComponent(value), expires, path, domain, secure].join('');
          } else { // only name given, get cookie
            var cookieValue = null;
            if (document.cookie && document.cookie != '') {
              var cookies = document.cookie.split(';');
              for (var i = 0; i < cookies.length; i++) {
                var cookie = jQuery.trim(cookies[i]);
                // Does this cookie string begin with the name we want?
                if (cookie.substring(0, name.length + 1) == (name + '=')) {
                  cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                  break;
                }
              }
            }
            return cookieValue;
          }
        };
      </script>
