# 電影行程 iOS 原生 App（SwiftUI）。用 XcodeGen 產生 Xcode 專案：
#   brew install xcodegen && cd ios && xcodegen && open MovieSchedule.xcodeproj
name: MovieSchedule
options:
  bundleIdPrefix: com.morgan91204
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_LANGUAGE: zh-Hant
targets:
  MovieSchedule:
    type: application
    platform: iOS
    sources:
      - MovieSchedule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morgan91204.movieschedule
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: 電影行程
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: 把你選的電影場次加入行事曆。
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
  MovieScheduleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MovieScheduleTests
    dependencies:
      - target: MovieSchedule
schemes:
  MovieSchedule:
    build:
      targets:
        MovieSchedule: all
        MovieScheduleTests: [test]
    test:
      targets:
        - MovieScheduleTests
