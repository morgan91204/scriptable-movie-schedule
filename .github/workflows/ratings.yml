# 年度票房排行的三大評分：每小時慢慢查幾十部（一部一部隔開），幾天查完七千多部；查過的固定存在 data 分支的 ratings-years.json
name: 建立年度排行的評分
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      max:
        description: 這一輪最多查幾部
        default: "1200"
      lanes:
        description: 幾條線同時查（1～4）
        default: "3"
permissions:
  contents: write
# 自己一組：一輪要跑半小時以上，跟其他排程排同一組會讓它們一直等
concurrency:
  group: ratings-years
  cancel-in-progress: false
jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 取上一次的評分紀錄
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/ratings-years.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-ratings.json" || echo "還沒有評分紀錄，從頭查"
      - name: 查評分（慢慢查，連續讀不到就提早結束）
        run: node tools/ratings-years.mjs "$RUNNER_TEMP/prev-ratings.json" "$RUNNER_TEMP/ratings-years.json"
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          # 第一次建立（七千多部）時加快：三條線、一輪最多 1200 部、跑 42 分鐘；全部查完後每輪只剩新片和要重查的幾部，自然就慢下來
          RATINGS_MAX: ${{ inputs.max || '1200' }}
          RATINGS_LANES: ${{ inputs.lanes || '3' }}
          RATINGS_MINUTES: "42"
      - name: 發佈到 data 分支（跟其他排程同時發佈時可能被蓋掉，所以確認一次，沒上去就再發一次）
        run: |
          tools/publish-data.sh "$RUNNER_TEMP/ratings-years.json" ratings-years.json "更新資料"
          sleep 20
          git checkout -q -f "$GITHUB_SHA"
          git fetch -q origin data
          if ! git show FETCH_HEAD:ratings-years.json | cmp -s - "$RUNNER_TEMP/ratings-years.json"; then echo "被蓋掉了，再發一次"; tools/publish-data.sh "$RUNNER_TEMP/ratings-years.json" ratings-years.json "更新資料"; fi
