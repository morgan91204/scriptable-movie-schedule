# 把幾個網頁存成測試用的樣本（只能手動執行）：存到 fixtures 分支的 <資料夾>/ 底下，不動 main。
# 用在「趁網頁還在」先留一份，之後對著它寫解析程式（例如影展結束後場次頁就會清空）。
name: 存網頁樣本
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 要存的網址（多個用空白分開）。填 festival-full 則改存「整個影展的場次」（含已經演過的，測試用）
        required: true
      folder:
        description: 存到 fixtures 分支的哪個資料夾
        required: true
        default: festival
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 讀取並存檔
        env:
          URLS: ${{ inputs.urls }}
          FOLDER: ${{ inputs.folder }}
        run: |
          case "$FOLDER" in *[!A-Za-z0-9_-]*|"") echo "資料夾名稱只能用英數、底線、連字號"; exit 1;; esac
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          mkdir -p "$RUNNER_TEMP/out"; : > "$RUNNER_TEMP/out/index.txt"; n=0
          if [ "$URLS" = "festival-full" ]; then KEEP_PAST=1 node tools/festival.mjs "$RUNNER_TEMP/out/festival-full.json" | tee -a "$RUNNER_TEMP/out/index.txt"; URLS=""; fi
          for U in $URLS; do
            n=$((n+1)); F=$(printf "%02d.html" "$n")
            code=$(curl -sS -m 40 -L -A "$UA" -H "Accept-Language: zh-TW,zh;q=0.9" -o "$RUNNER_TEMP/out/$F" -w "%{http_code}" -- "$U" || echo ERR)
            echo "$F $code $(wc -c < "$RUNNER_TEMP/out/$F" 2>/dev/null || echo 0) $U" | tee -a "$RUNNER_TEMP/out/index.txt"
            sleep 1
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin fixtures 2>/dev/null; then git checkout -q -f --detach FETCH_HEAD; else git checkout -q --orphan fixtures-new; git rm -rfq . || true; fi
          D="$FOLDER/$(date -u +%Y%m%d-%H%M%S)"; mkdir -p "$D"; cp "$RUNNER_TEMP"/out/* "$D"/
          git add "$D"; git commit -q -m "存網頁樣本：$D"; git push -q origin HEAD:fixtures
          echo "已存到 fixtures 分支的 $D"
