# 電影資料總表：每小時把上映中與票房榜電影的海報、預告、三大評分、片長查好，存成 data 分支的 meta.json
name: 更新電影資料
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      recheck:
        description: 缺海報或預告的片立刻重查（改了比對規則時用）
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: data-branch
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 取上一次的總表
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/meta.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev.json" || echo "還沒有總表，從頭查"
      - name: 查資料
        run: node tools/meta.mjs "$RUNNER_TEMP/prev.json" "$RUNNER_TEMP/meta.json"
        env:
          RECHECK: ${{ inputs.recheck && '1' || '' }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }} # 只用來補片長；沒設定就跳過這一步
      - name: 取上一次的開眼場次
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/at.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-at.json" || echo "還沒有，從頭抓"
      - name: 抓開眼場次（只有開眼有的戲院、要補頂級影廳的威秀）
        run: node tools/at.mjs "$RUNNER_TEMP/prev-at.json" "$RUNNER_TEMP/at.json"
      - name: 取上一次的場次通場次
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/tw-near.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-tw-near.json" || echo "還沒有近期檔"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/tw-far.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-tw-far.json" || echo "還沒有遠期檔"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/official.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-official.json" || echo "還沒有官網檔"
      - name: 抓場次通與官網來源的場次（「現在有什麼可以看」用）
        run: node tools/tw.mjs "$RUNNER_TEMP/prev-tw-near.json" "$RUNNER_TEMP/prev-tw-far.json" "$RUNNER_TEMP/tw-near.json" "$RUNNER_TEMP/tw-far.json" "$RUNNER_TEMP/prev-official.json" "$RUNNER_TEMP/official.json"
      - name: 讀影展場次（各影展官網；今年已經結束的也留著）
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/festival.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-festival.json" || echo "還沒有影展檔"
          FESTIVAL_BASE="https://raw.githubusercontent.com/${{ github.repository }}/data" node tools/festival.mjs "$RUNNER_TEMP/festival.json" "$RUNNER_TEMP/prev-festival.json" || echo "影展場次這次略過"
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }} # 官網沒有劇照的片用 TMDB 補（查過的不再查）
          FESTIVAL_IMG_BASE: https://raw.githubusercontent.com/${{ github.repository }}/img # 劇照備份放的地方（img 分支）
      - name: 年度票房排行的海報（TMDB；查過的不再查，一次最多 3000 部）
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/posters.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-posters.json" || echo "還沒有海報對照表"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/posters-miss.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-posters-miss.json" || true
          node tools/posters.mjs "$RUNNER_TEMP/prev-posters.json" "$RUNNER_TEMP/prev-posters-miss.json" "$RUNNER_TEMP/posters.json" "$RUNNER_TEMP/posters-miss.json" || echo "年度排行海報這次略過"
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - name: 即將上映的片單（開眼的近期上映；六小時抓一次，海報用 TMDB 查）
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/upcoming.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-upcoming.json" || echo "還沒有即將上映的片單"
          node tools/upcoming.mjs "$RUNNER_TEMP/prev-upcoming.json" "$RUNNER_TEMP/upcoming.json" || echo "即將上映的片單這次略過"
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - name: 通知用的精簡資料（收藏電影的通知每小時用它判斷）
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/notify.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-notify.json" || echo "還沒有通知資料"
          node tools/notify.mjs "$RUNNER_TEMP/prev-notify.json" "$RUNNER_TEMP/festival.json" "$RUNNER_TEMP/notify.json" "$RUNNER_TEMP/tw-near.json" "$RUNNER_TEMP/official.json" || echo "通知資料這次略過"
      - name: 發佈影展劇照的備份到 img 分支（要比影展資料先發佈：資料裡的圖片網址指向這裡）
        run: |
          tools/publish-images.sh "$RUNNER_TEMP/fest-img"
          git checkout -q -f "$GITHUB_SHA"
      - name: 發佈到 data 分支
        run: tools/publish-data.sh "$RUNNER_TEMP/meta.json" meta.json "更新資料"
      - name: 發佈開眼場次到 data 分支
        run: |
          git checkout -q -f "$GITHUB_SHA"
          tools/publish-data.sh "$RUNNER_TEMP/at.json" at.json "更新資料"
      - name: 發佈場次通場次到 data 分支
        run: |
          git checkout -q -f "$GITHUB_SHA"
          tools/publish-data.sh "$RUNNER_TEMP/tw-near.json" tw-near.json "更新資料"
          git checkout -q -f "$GITHUB_SHA"
          tools/publish-data.sh "$RUNNER_TEMP/tw-far.json" tw-far.json "更新資料"
          git checkout -q -f "$GITHUB_SHA"
          tools/publish-data.sh "$RUNNER_TEMP/official.json" official.json "更新資料"
          git checkout -q -f "$GITHUB_SHA"
          tools/publish-data.sh "$RUNNER_TEMP/festival.json" festival.json "更新資料"
          # 年度票房排行的海報對照表（和「查過沒有」的紀錄）
          git checkout -q -f "$GITHUB_SHA"
          tools/publish-data.sh "$RUNNER_TEMP/posters.json" posters.json "更新資料"
          git checkout -q -f "$GITHUB_SHA"
          tools/publish-data.sh "$RUNNER_TEMP/posters-miss.json" posters-miss.json "更新資料"
          # 即將上映的片單
          if [ -f "$RUNNER_TEMP/upcoming.json" ]; then
            git checkout -q -f "$GITHUB_SHA"
            tools/publish-data.sh "$RUNNER_TEMP/upcoming.json" upcoming.json "更新資料"
          fi
          # 通知用的精簡資料
          if [ -f "$RUNNER_TEMP/notify.json" ]; then
            git checkout -q -f "$GITHUB_SHA"
            tools/publish-data.sh "$RUNNER_TEMP/notify.json" notify.json "更新資料"
          fi
          # 劇照備份的對照表（原圖網址 → 備份檔）
          if [ -f "$RUNNER_TEMP/festival-images.json" ]; then
            git checkout -q -f "$GITHUB_SHA"
            tools/publish-data.sh "$RUNNER_TEMP/festival-images.json" festival-images.json "更新資料"
          fi
          # 各影展來源這次的讀取狀態（每週的檢查會看）
          git checkout -q -f "$GITHUB_SHA"
          tools/publish-data.sh "$RUNNER_TEMP/festival-status.json" festival-status.json "更新資料"
          # 每年的影展另存一份帶年份的檔（跨年後留著回顧）
          for F in "$RUNNER_TEMP"/festival-20[0-9][0-9].json; do
            [ -f "$F" ] || continue
            git checkout -q -f "$GITHUB_SHA"
            tools/publish-data.sh "$F" "$(basename "$F")" "更新資料"
          done
