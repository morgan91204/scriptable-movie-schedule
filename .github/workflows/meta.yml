# 電影資料總表：每小時把上映中與票房榜電影的海報、預告、三大評分、片長查好，存成 data 分支的 meta.json
name: 更新電影資料
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      recheck:
        description: 缺海報或預告的片立刻重查（改了比對規則時用）
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: data-branch
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 取上一次的總表
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/meta.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev.json" || echo "還沒有總表，從頭查"
      - name: 查資料
        run: node tools/meta.mjs "$RUNNER_TEMP/prev.json" "$RUNNER_TEMP/meta.json"
        env:
          RECHECK: ${{ inputs.recheck && '1' || '' }}
      - name: 取上一次的開眼場次
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/at.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-at.json" || echo "還沒有，從頭抓"
      - name: 抓開眼場次（只有開眼有的戲院、要補頂級影廳的威秀）
        run: node tools/at.mjs "$RUNNER_TEMP/prev-at.json" "$RUNNER_TEMP/at.json"
      - name: 取上一次的場次通場次
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/tw-near.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-tw-near.json" || echo "還沒有近期檔"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/tw-far.json?t=$(date +%s)" -o "$RUNNER_TEMP/prev-tw-far.json" || echo "還沒有遠期檔"
      - name: 抓場次通場次（所有連鎖影城；「現在有什麼可以看」用）
        run: node tools/tw.mjs "$RUNNER_TEMP/prev-tw-near.json" "$RUNNER_TEMP/prev-tw-far.json" "$RUNNER_TEMP/tw-near.json" "$RUNNER_TEMP/tw-far.json"
      - name: 發佈到 data 分支
        run: tools/publish-data.sh "$RUNNER_TEMP/meta.json" meta.json "更新資料"
      - name: 發佈開眼場次到 data 分支
        run: |
          git checkout -q -f "$GITHUB_SHA"
          tools/publish-data.sh "$RUNNER_TEMP/at.json" at.json "更新資料"
      - name: 發佈場次通場次到 data 分支
        run: |
          git checkout -q -f "$GITHUB_SHA"
          tools/publish-data.sh "$RUNNER_TEMP/tw-near.json" tw-near.json "更新資料"
          git checkout -q -f "$GITHUB_SHA"
          tools/publish-data.sh "$RUNNER_TEMP/tw-far.json" tw-far.json "更新資料"
