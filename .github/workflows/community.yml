# 觀眾評分總表：每 30 分鐘把 Worker 的統計存成靜態檔（data 分支的 community.json），有變化才提交
name: 匯出觀眾評分
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-branch
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 讀評分總表
        run: node tools/community.mjs "$RUNNER_TEMP/community.json"
      - name: 有變化才發佈到 data 分支
        run: tools/publish-data.sh "$RUNNER_TEMP/community.json" community.json "更新資料"
