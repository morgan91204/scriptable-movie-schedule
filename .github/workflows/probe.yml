# 診斷用（只能手動執行）：從 GitHub 的機器讀一個網址，看對方回什麼。評估新的資料來源時用，不會寫入任何東西。
name: 測試來源網站
on:
  workflow_dispatch:
    inputs:
      url:
        description: 要測試的網址（可以多個，用空白分開）
        required: true
      pattern:
        description: （選填）要在內容裡找的字（正規表示式），會印出前後文
        required: false
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 讀取並顯示回應
        env:
          TARGET: ${{ inputs.url }}
          PATTERN: ${{ inputs.pattern }}
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          # 可以一次給好幾個網址（用空白分開）
          for U in $TARGET; do
            echo "════════ $U"
            curl -sS -m 40 -L -A "$UA" -H "Accept-Language: zh-TW,zh;q=0.9" -D headers.txt -o body.bin -w "狀態 %{http_code}，大小 %{size_download}，最後網址 %{url_effective}\n" -- "$U" || true
            echo "── 標頭（重點）──"; grep -iE "^(HTTP|server|content-type|cf-mitigated|location|x-powered-by|set-cookie)" headers.txt | cut -c1-160 | head -12 || true
            echo "── 標題與內容開頭 ──"; grep -aoiE "<title>[^<]*" body.bin | head -2 || true; head -c 600 body.bin | tr '\n' ' ' || true
            echo; echo "── 內容裡的連結（片單、場次、資料介面）──"
            grep -aoiE "(href|src|action|url)[=:] ?[\"'][^\"' ]*(film|programme|schedule|session|ticket|api|json|ashx|activity|game)[^\"' ]*[\"']" body.bin | sort -u | head -40 || true
            if [ -n "$PATTERN" ]; then
              echo "── 含「$PATTERN」的片段（共 $(grep -aoE -- "$PATTERN" body.bin | wc -l) 處）──"
              tr '\n\r\t' '   ' < body.bin | grep -aoE -- ".{0,300}($PATTERN).{0,700}" | head -4 || true
            fi
          done
