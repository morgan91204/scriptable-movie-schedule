# 全台票房排行：每小時檢查國家電影及視聽文化中心的開放資料，有新的一週就更新 dist/boxoffice.json
# 官方大約每週二公布上一週（週一到週日）的數字，時間不固定；GitHub 的排程又常晚幾個小時才跑，
# 一天只查一次的話可能隔天才更新。改成每小時查：沒有新資料時只發一個請求就結束，幾秒鐘
name: 更新票房排行
on:
  schedule:
    - cron: "47 * * * *" # 每小時一次
  workflow_dispatch:
    inputs:
      force:
        description: 官方資料沒更新也重新產生（改了排行規則時用）
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: boxoffice
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 讀官方資料、算排行
        run: node tools/boxoffice.mjs
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
      - name: 有變化才提交
        run: |
          git add dist/boxoffice.json dist/boxoffice-years.json dist/boxoffice-weeks.json dist/boxoffice-info-*.json data/boxoffice-snapshot.json
          if git diff --cached --quiet; then
            echo "官方資料沒有更新"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "更新票房排行（$(node -p "require('./dist/boxoffice.json').end")）"
          git pull --rebase origin main
          git push origin HEAD:main
