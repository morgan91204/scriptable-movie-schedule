# 原生 iOS App：在 macOS 上產生專案、編譯，並在模擬器用真實網路跑資料層測試
name: iOS 編譯與測試
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 選用最新的 Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$LATEST" ] && sudo xcode-select -s "$LATEST"
          xcodebuild -version
      - name: 產生 Xcode 專案
        run: |
          brew install xcodegen >/dev/null
          cd ios && xcodegen
      - name: 編譯並測試
        run: |
          cd ios
          xcodebuild -version
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]|iPhone [2-9][0-9]" | head -1 | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          echo "模擬器：$DEVICE"
          export TEST_RUNNER_SHOT_DIR="$RUNNER_TEMP/shots"
          set -o pipefail
          xcodebuild test -project MovieSchedule.xcodeproj -scheme MovieSchedule \
            -destination "platform=iOS Simulator,name=$DEVICE" CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log \
            | grep -E "error:|warning: var|✅|Test Case .*(passed|failed)|\*\* TEST|\*\* BUILD|Executed [0-9]+ tests|XCTAssert|failed -|找不到" || true
          grep -q "\*\* BUILD\|\*\* TEST" build.log
          grep -q "BridgeTests.*failed" build.log && exit 1 || true
      - name: 檢查上架用的建置（不簽署）
        run: |
          cd ios
          set -o pipefail
          xcodebuild archive -project MovieSchedule.xcodeproj -scheme MovieSchedule -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Check.xcarchive" CODE_SIGNING_ALLOWED=NO 2>&1 | tee archive.log | grep -E "error:|warning: .*(icon|privacy|Privacy)|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log
          APP="$RUNNER_TEMP/Check.xcarchive/Products/Applications/MovieSchedule.app"
          ls "$APP" | grep -E "AppIcon|PrivacyInfo|core.js|Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist" | head -8
      - name: 發佈截圖到 ios-shots 分支
        if: always()
        run: |
          DIR="$RUNNER_TEMP/shots"
          ls "$DIR"/*.png >/dev/null 2>&1 || { echo "沒有截圖"; exit 0; }
          for f in "$DIR"/*.png; do sips -Z 1300 "$f" >/dev/null; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan ios-shots-new
          git rm -rfq . || true
          cp "$DIR"/*.png .
          git add ./*.png
          git commit -q -m "App 截圖（$GITHUB_SHA）"
          git push -q -f origin HEAD:ios-shots
          ls -la ./*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - name: 失敗時顯示紀錄結尾
        if: failure()
        run: tail -60 ios/build.log || true
